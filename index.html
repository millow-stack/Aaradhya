<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#D84315">
  <meta name="description" content="Aaradhya — A trusted ritual-management platform that makes Hindu rituals easier to discover, book, coordinate, track, and repeat for a family. Faith with less friction.">
  <title>Aaradhya — Your rituals, organised.</title>

  <!-- Modern Variable Sans + Sacred Serif + Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="mode-responsive" data-theme="dark">
  <!-- Interactive Ambient Cursor Glow Mesh -->
  <div class="ambient-cursor-glow" id="ambientCursorGlow" aria-hidden="true"></div>

  <!-- Pitch & Demo Presentation Controller Bar -->
  <aside class="demo-bar" aria-label="Demo Presentation Controller">
    <div class="demo-bar-inner">
      <div class="demo-tag">
        <span class="pulse-dot"></span>
        <strong>Aaradhya Devotional 2026</strong>
        <span class="demo-sub">Sattvic Essence</span>
      </div>
      <div class="demo-actions">
        <button type="button" class="demo-btn" onclick="toggleDevotionalTheme()" id="themeToggleDemoBtn" title="Toggle Sattvic Light / Sanctum Night theme">
          <span id="themeToggleDemoIcon">🌙</span> <span id="themeToggleDemoText">Sanctum Mode</span>
        </button>
        <button type="button" class="demo-btn" onclick="openJapaMalaModal()" title="Open Tactile Digital Prayer Beads (Japa Counter)">
          <span>📿</span> <span>Japa Mala</span>
        </button>
        <button type="button" class="demo-btn" onclick="toggleAartiPlayer()" id="aartiQuickBtn" title="Toggle Aarti & Mantra Audio Visualizer">
          <span id="aartiQuickIcon">🎵</span> <span>Aarti Sound</span>
        </button>
        <button type="button" class="demo-btn pitch-btn" onclick="startPitchFlow()" title="Auto-advance through core pitch flow">
          <span>⚡</span> <strong>Pitch Demo (60s)</strong>
        </button>
        <button type="button" class="demo-btn" onclick="toggleDeviceFrame()" id="frameToggleBtn" title="Toggle mobile viewport simulation frame">
          <span id="frameToggleIcon">📱</span> <span id="frameToggleText">Mobile Frame</span>
        </button>
        <button type="button" class="demo-btn" onclick="resetDemoData()" title="Reset all state to initial demo data">
          <span>🔄</span> <span>Reset</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Viewport Wrapper (Can toggle between full responsive and mobile frame) -->
  <div id="deviceWrapper" class="device-wrapper">
    <div class="device-phone">
      <!-- Speaker & Notch for Phone View -->
      <div class="phone-notch" aria-hidden="true">
        <span class="notch-speaker"></span>
      </div>

      <!-- App Header per design.json -->
      <header class="app-header">
        <div class="header-inner">
          <button type="button" class="brand-btn" onclick="nav('home')" aria-label="Aaradhya Home">
            <span class="sacred-symbol">ॐ</span>
            <div class="brand-text">
              <span class="brand-name">Aaradhya</span>
              <span class="brand-tagline">Your rituals, organised.</span>
            </div>
          </button>

          <div class="header-tools">
            <button type="button" class="icon-btn tool-pill-btn" onclick="openLocationPicker()" aria-label="Select City" title="Location: Delhi NCR">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              <span class="city-pill">Delhi NCR</span>
            </button>
            <button type="button" class="icon-btn" onclick="openJapaMalaModal()" aria-label="Japa Mala Counter" title="Tactile Digital Prayer Beads">
              <span style="font-size:16px;">📿</span>
            </button>
            <button type="button" class="icon-btn" onclick="toggleAartiPlayer()" aria-label="Aarti Player" title="Aarti & Mantra Visualizer">
              <span id="headerAartiIcon" style="font-size:16px;">🪔</span>
            </button>
            <button type="button" class="icon-btn" onclick="toggleDevotionalTheme()" aria-label="Switch Theme" title="Toggle Sattvic Light / Dark Theme">
              <span id="headerThemeIcon" style="font-size:16px;">🌙</span>
            </button>
            <button type="button" class="icon-btn" onclick="openNotifications()" aria-label="Notifications" title="Smart Ritual Reminders">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              <span class="notif-badge">1</span>
            </button>
            <button type="button" class="icon-btn" onclick="openHelpSupport()" aria-label="Help and Trust Stack">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Stage Container -->
      <main id="app" class="app-main" role="main"></main>

      <!-- 5-Item Bottom Navigation (Home, Book, Bookings, Family, Profile) -->
      <nav class="bottom-nav" aria-label="Primary Navigation">
        <div class="bottom-nav-inner" id="bottomNavContainer">
          <!-- Populated dynamically by app.js -->
        </div>
      </nav>

    </div>
  </div>

  <!-- Global Toast Feedback -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Reusable Modal / Drawer Stage -->
  <div id="modalStage" class="modal-backdrop" aria-hidden="true" onclick="handleBackdropClick(event)">
    <div class="modal-card" id="modalBox" role="dialog" aria-modal="true">
      <!-- Dynamic content inserted by app.js -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
