<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta name="theme-color" content="#D84315">
  <meta name="description" content="Aaradhya — A trusted ritual-management platform that makes Hindu rituals easier to discover, book, coordinate, track, and repeat for a family. Faith with less friction.">
  <title>Aaradhya — Your rituals, organised.</title>

  <!-- Modern Variable Sans + Sacred Serif + Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">

  <!-- Font Awesome 6.5.1 (High-Performance Vector Icon Library) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Favicon and App Icon -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="mode-responsive" data-theme="dark">
  <!-- Aaradhya Sacred Splash Screen with Logo -->
  <div id="splashScreen" class="splash-screen" role="dialog" aria-modal="true" aria-label="Aaradhya Splash Screen" onclick="dismissSplashScreen()">
    <div class="splash-particles-mesh" aria-hidden="true"></div>
    <div class="splash-card" onclick="event.stopPropagation()">
      <div class="splash-logo-container">
        <div class="splash-halo"></div>
        <img src="logo.png" alt="Aaradhya Logo" class="splash-logo">
      </div>
      <div class="splash-brand-info">
        <h1 class="splash-title">Aaradhya</h1>
        <p class="splash-subtitle">॥ श्रद्धा • संकल्प • संस्कार ॥</p>
        <p class="splash-tagline">Your rituals, organised.</p>
      </div>
      <div class="splash-loader-wrap">
        <div class="splash-progress-track">
          <div class="splash-progress-bar" id="splashProgressBar"></div>
        </div>
        <div class="splash-status" id="splashStatus">Awakening Vedic Sanctum...</div>
      </div>
      <button type="button" class="splash-skip" onclick="dismissSplashScreen()" aria-label="Enter App Directly">
        <span>Enter App</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- Interactive Ambient Cursor Glow Mesh -->
  <div class="ambient-cursor-glow" id="ambientCursorGlow" aria-hidden="true"></div>

  <!-- Offline Resilience Banner -->
  <div id="offlineBanner" class="offline-banner" style="display:none" role="alert" aria-live="assertive">
    <div class="offline-banner-inner">
      <i class="fa-solid fa-wifi" style="margin-right:6px"></i>
      <span><strong>Offline Local Mode</strong> — Operating securely from device memory. Your bookings, family records, and prayer utilities remain active.</span>
    </div>
  </div>

  <!-- Material Context Menu (Replaces Persistent Top Bar) -->
  <div id="contextMenuBackdrop" class="context-menu-backdrop" onclick="closeContextMenu()" aria-hidden="true">
    <div class="context-menu-surface md-elevation-3" id="contextMenuSurface" role="menu" aria-label="Demo Presentation & Developer Controller" onclick="event.stopPropagation()">
      <div class="context-menu-header">
        <div class="context-menu-title">
          <img src="logo.png" alt="Aaradhya Logo" class="context-brand-logo">
          <span>Aaradhya Controller</span>
        </div>
        <span class="context-menu-badge">Material UI 3</span>
      </div>
      <div class="context-menu-items">
        <button type="button" class="context-menu-item md-ripple" onclick="startPitchFlow(); closeContextMenu();" role="menuitem">
          <span class="context-icon-box" style="background:rgba(255,179,0,0.18); color:var(--gold)"><i class="fa-solid fa-bolt"></i></span>
          <div class="context-item-text">
            <strong>Pitch Demo (60s)</strong>
            <span>Auto-advance core customer ritual journey</span>
          </div>
        </button>
        <button type="button" class="context-menu-item md-ripple" onclick="toggleDevotionalTheme(); closeContextMenu();" role="menuitem">
          <span class="context-icon-box" style="background:rgba(255,111,0,0.18); color:var(--saffron)"><i class="fa-solid fa-circle-half-stroke" id="themeMenuIcon"></i></span>
          <div class="context-item-text">
            <strong id="themeMenuTitle">Switch Theme</strong>
            <span>Toggle Sanctum Dark / Sattvic Light</span>
          </div>
        </button>
        <button type="button" class="context-menu-item md-ripple" onclick="openJapaMalaModal(); closeContextMenu();" role="menuitem">
          <span class="context-icon-box" style="background:rgba(0,230,118,0.18); color:var(--emerald)"><i class="fa-solid fa-dharmachakra"></i></span>
          <div class="context-item-text">
            <strong>108 Japa Mala Counter</strong>
            <span>Tactile prayer beads with Android haptics</span>
          </div>
        </button>
        <button type="button" class="context-menu-item md-ripple" onclick="toggleAartiPlayer(); closeContextMenu();" role="menuitem">
          <span class="context-icon-box" style="background:rgba(0,229,255,0.18); color:var(--cyan-glow)"><i class="fa-solid fa-music"></i></span>
          <div class="context-item-text">
            <strong>Sacred Aarti Sound</strong>
            <span>Tanpura harmonics & Vedic chanting</span>
          </div>
        </button>
        <button type="button" class="context-menu-item md-ripple" onclick="openTelemetryDrawer(); closeContextMenu();" role="menuitem">
          <span class="context-icon-box" style="background:rgba(167,139,250,0.18); color:#C4B5FD"><i class="fa-solid fa-chart-line"></i></span>
          <div class="context-item-text">
            <strong>System Audit Log</strong>
            <span>Real-time telemetry and state transitions</span>
          </div>
        </button>
        <button type="button" class="context-menu-item md-ripple" onclick="openBackupModal(); closeContextMenu();" role="menuitem">
          <span class="context-icon-box" style="background:rgba(0,230,118,0.18); color:var(--emerald)"><i class="fa-solid fa-database"></i></span>
          <div class="context-item-text">
            <strong>Backup & Restore</strong>
            <span>Export/import ritual vault JSON archive</span>
          </div>
        </button>
        <button type="button" class="context-menu-item md-ripple" onclick="toggleDeviceFrame(); closeContextMenu();" role="menuitem">
          <span class="context-icon-box" style="background:rgba(255,179,0,0.18); color:var(--gold)"><i class="fa-solid fa-mobile-screen" id="frameMenuIcon"></i></span>
          <div class="context-item-text">
            <strong id="frameMenuTitle">Device Frame View</strong>
            <span>Toggle 390px mobile frame & responsive</span>
          </div>
        </button>
        <button type="button" class="context-menu-item md-ripple" onclick="showSplashScreen(); closeContextMenu();" role="menuitem">
          <span class="context-icon-box" style="background:rgba(255,111,0,0.18); color:var(--saffron)"><i class="fa-solid fa-play"></i></span>
          <div class="context-item-text">
            <strong>Splash Screen</strong>
            <span>Replay opening screen with logo</span>
          </div>
        </button>
        <button type="button" class="context-menu-item md-ripple" onclick="confirmResetDemoData(); closeContextMenu();" role="menuitem" style="border-top:1px solid var(--border-subtle); color:#FF8A80">
          <span class="context-icon-box" style="background:rgba(255,61,0,0.18); color:#FF8A80"><i class="fa-solid fa-arrow-rotate-left"></i></span>
          <div class="context-item-text">
            <strong style="color:#FF8A80">Reset Demo Data</strong>
            <span>Restore pristine state in LocalStorage</span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Viewport Wrapper (Can toggle between full responsive and mobile frame) -->
  <div id="deviceWrapper" class="device-wrapper">
    <div class="device-phone">
      <!-- Speaker & Notch for Phone View -->
      <div class="phone-notch" aria-hidden="true">
        <span class="notch-speaker"></span>
      </div>

      <!-- App Header per design.json & Material Design 3 Top App Bar -->
      <header class="app-header">
        <div class="header-inner">
          <button type="button" class="brand-btn md-ripple" onclick="nav('home')" aria-label="Aaradhya Home">
            <img src="logo.png" alt="Aaradhya Logo" class="brand-logo-img">
            <div class="brand-text">
              <span class="brand-name">Aaradhya</span>
              <span class="brand-tagline">Your rituals, organised.</span>
            </div>
          </button>

          <div class="header-tools">
            <button type="button" class="icon-btn tool-pill-btn md-ripple" onclick="openLocationPicker()" aria-label="Select City" title="Location: Delhi NCR">
              <i class="fa-solid fa-location-dot" style="font-size:13px"></i>
              <span class="city-pill">Delhi NCR</span>
            </button>
            <button type="button" class="icon-btn md-ripple" onclick="openJapaMalaModal()" aria-label="Japa Mala Counter" title="Tactile Digital Prayer Beads">
              <i class="fa-solid fa-hands-praying"></i>
            </button>
            <button type="button" class="icon-btn md-ripple" onclick="toggleAartiPlayer()" aria-label="Aarti Player" title="Aarti & Mantra Visualizer">
              <i class="fa-solid fa-bell" id="headerAartiIcon"></i>
            </button>
            <button type="button" class="icon-btn md-ripple" onclick="toggleDevotionalTheme()" aria-label="Switch Theme" title="Toggle Sattvic Light / Dark Theme">
              <i class="fa-solid fa-moon" id="headerThemeIcon"></i>
            </button>
            <button type="button" class="icon-btn md-ripple" onclick="openNotifications()" aria-label="Notifications" title="Smart Ritual Reminders">
              <i class="fa-solid fa-bell"></i>
              <span class="notif-badge">1</span>
            </button>
            <button type="button" class="icon-btn md-ripple" onclick="openHelpSupport()" aria-label="Help and Trust Stack" title="Aaradhya Trust Stack & Concierge">
              <i class="fa-solid fa-circle-question"></i>
            </button>
            <!-- Material Context Menu Overflow Button -->
            <button type="button" class="icon-btn md-ripple" onclick="toggleContextMenu()" id="headerContextMenuBtn" aria-label="Open Demo Presentation Controller Menu" title="Presentation Controller Menu">
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Stage Container -->
      <main id="app" class="app-main" role="main"></main>

      <!-- 5-Item Bottom Navigation (Home, Book, Bookings, Family, Profile) -->
      <nav class="bottom-nav" aria-label="Primary Navigation">
        <div class="bottom-nav-inner" id="bottomNavContainer">
          <!-- Populated dynamically by app.js -->
        </div>
      </nav>

      <!-- Material 3 Floating Action Button (FAB) -->
      <button type="button" class="md-fab md-ripple" onclick="toggleContextMenu()" id="fabContextTrigger" aria-label="Open Material Context Menu" title="Presentation Menu">
        <i class="fa-solid fa-sliders"></i>
      </button>

    </div>
  </div>

  <!-- Global Toast Feedback -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Reusable Modal / Drawer Stage -->
  <div id="modalStage" class="modal-backdrop" aria-hidden="true" onclick="handleBackdropClick(event)">
    <div class="modal-card" id="modalBox" role="dialog" aria-modal="true">
      <!-- Dynamic content inserted by app.js -->
    </div>
  </div>

  <!-- Core Architecture & Services (Zero External Runtime Dependencies) -->
  <script src="js/core/security.js"></script>
  <script src="js/data/catalog.js"></script>
  <script src="js/services/panchang.js"></script>
  <script src="js/services/audio.js"></script>
  <script src="js/services/certificate.js"></script>
  <script src="js/core/store.js"></script>
  <script src="app.js"></script>
</body>
</html>
